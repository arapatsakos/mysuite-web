<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MySuite</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #1e1e1e; color: #f6eed6; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #f6eed6; }
</style>
</head>
<body>
<main>
  <p>Επιστροφή στο MySuite…</p>
  <p><a id="back" href="mysuite://bank-callback">Άνοιγμα MySuite</a></p>
</main>
<script>
  // Η τράπεζα γυρίζει εδώ με ?code=…&state=…: τα περνάμε αυτούσια στην εφαρμογή. Τίποτα δεν αποθηκεύεται εδώ.
  var target = "mysuite://bank-callback" + window.location.search;
  document.getElementById("back").href = target;
  window.location.replace(target);
</script>
</body>
</html>
